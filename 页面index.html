<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环保设备厂家直销</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "微软雅黑", sans-serif; background: #f5f5f5; }
        header { background: #0066cc; color: #fff; text-align: center; padding: 20px; }
        .desc { text-align: center; padding: 10px; color: #666; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .product-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .product-item { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 0 5px #ddd; }
        .product-item h3 { margin: 10px 0; color: #333; }
        .price { color: red; font-size: 18px; font-weight: bold; }
        .contact { background: #222; color: #fff; text-align: center; padding: 30px; margin-top: 30px; }
    </style>
</head>
<body>
    <header>
        <h1>环保设备厂家直销</h1>
        <p>雾炮机 | 工地洗车机 | 除尘设备 源头厂家</p>
    </header>

    <div class="desc">
        <p>工厂直供 · 全国发货 · 支持定制 · 质保售后</p>
    </div>

    <div class="container">
        <div class="product-list">
            <!-- 商品1 -->
            <div class="product-item">
                <h3>30米全自动雾炮机</h3>
                <p>工地除尘专用，射程远，雾化细</p>
                <p class="price">￥3500 起</p>
            </div>
            <!-- 商品2 -->
            <div class="product-item">
                <h3>工地全自动洗车机</h3>
                <p>工程车辆清洗，免基础安装</p>
                <p class="price">￥8000 起</p>
            </div>
            <!-- 商品3 -->
            <div class="product-item">
                <h3>围挡喷淋降尘系统</h3>
                <p>工地围墙喷淋，环保达标必备</p>
                <p class="price">￥1200 起</p>
            </div>
        </div>
    </div>

    <div class="contact">
        <h2>联系我们</h2>
        <p>河北邢台源头工厂，欢迎咨询报价</p>
    </div>
</body>
</html>
